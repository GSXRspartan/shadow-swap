name: Security Engine Tests

# Executes the REAL Ootle engine test suite (audit_engine_tests) on Linux, where the engine's
# wasmer/Cranelift backend actually compiles (it does not on Windows). The cohort is tari-ootle
# v0.48.0 (6a25dbc), pinned in every Cargo.toml. This is the authoritative runtime evidence for
# the SECURITY_AUDIT_OPUS findings, OPUS-08, the add_liquidity_exact fix and the v0.48 wire
# fixtures the web suite consumes.
#
# This job is the ONLY place the real engine suites run: on a Windows developer machine
# `wasmer-compiler-cranelift` fails with `compile_error!`, which is a tooling limitation and
# not a contract limitation. All off-chain suites run on both platforms.
#
# The job MUST fail if the engine suite cannot compile or any test fails — the engine suite is
# never skipped.

on:
  pull_request:
  push:
    branches:
      - main
      - "security/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # PINNED, not `stable`: the reproducible-WASM gate below compares byte-exact hashes, which
      # change with the compiler. 1.97.1 is the channel tari-ootle v0.48.0 itself pins
      # (rust-toolchain.toml at 6a25dbc). Bump it together with templates/WASM_SHA256SUMS.
      - name: Install Rust toolchain (1.97.1 + wasm target)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo (registry, git, target)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Distinct caches per standalone crate/target we touch.
          key: security-engine-v048-rust-1.97.1

      # ---- Formatting (all Rust crates) ----
      - name: rustfmt (pool_math)
        run: cargo fmt --manifest-path crates/pool_math/Cargo.toml -- --check
      - name: rustfmt (pool_ref_model)
        run: cargo fmt --manifest-path crates/pool_ref_model/Cargo.toml -- --check
      - name: rustfmt (protocol_types)
        run: cargo fmt --manifest-path crates/protocol_types/Cargo.toml -- --check
      - name: rustfmt (fungible_pool template)
        run: cargo fmt --manifest-path templates/fungible_pool/Cargo.toml -- --check
      - name: rustfmt (nft_marketplace template)
        run: cargo fmt --manifest-path templates/nft_marketplace/Cargo.toml -- --check
      - name: rustfmt (nft_item_offer template)
        run: cargo fmt --manifest-path templates/nft_item_offer/Cargo.toml -- --check
      - name: rustfmt (nft_collection_bid template)
        run: cargo fmt --manifest-path templates/nft_collection_bid/Cargo.toml -- --check
      - name: rustfmt (p2p_offer template, experimental)
        run: cargo fmt --manifest-path templates/p2p_offer/Cargo.toml -- --check
      - name: rustfmt (revealed_asset_pool template, experimental)
        run: cargo fmt --manifest-path templates/revealed_asset_pool/Cargo.toml -- --check
      - name: rustfmt (audit_engine_tests)
        run: cargo fmt --manifest-path audit_engine_tests/Cargo.toml -- --check

      # ---- cargo check + clippy (warnings denied via RUSTFLAGS) ----
      - name: clippy (pool_math)
        run: cargo clippy --manifest-path crates/pool_math/Cargo.toml --all-targets --all-features
      - name: clippy (pool_ref_model)
        run: cargo clippy --manifest-path crates/pool_ref_model/Cargo.toml --all-targets --all-features
      - name: clippy (protocol_types)
        run: cargo clippy --manifest-path crates/protocol_types/Cargo.toml --all-targets --all-features
      - name: clippy (fungible_pool template, wasm)
        run: cargo clippy --manifest-path templates/fungible_pool/Cargo.toml --release --target wasm32-unknown-unknown
      - name: clippy (nft_marketplace template, wasm)
        run: cargo clippy --manifest-path templates/nft_marketplace/Cargo.toml --release --target wasm32-unknown-unknown
      - name: clippy (nft_item_offer template, wasm)
        run: cargo clippy --manifest-path templates/nft_item_offer/Cargo.toml --release --target wasm32-unknown-unknown
      - name: clippy (nft_collection_bid template, wasm)
        run: cargo clippy --manifest-path templates/nft_collection_bid/Cargo.toml --release --target wasm32-unknown-unknown
      - name: clippy (p2p_offer template, wasm, experimental)
        run: cargo clippy --manifest-path templates/p2p_offer/Cargo.toml --release --target wasm32-unknown-unknown
      - name: clippy (revealed_asset_pool template, wasm, experimental)
        run: cargo clippy --manifest-path templates/revealed_asset_pool/Cargo.toml --release --target wasm32-unknown-unknown

      # ---- Off-chain unit/property tests ----
      - name: test (pool_math)
        run: cargo test --manifest-path crates/pool_math/Cargo.toml
      - name: test (pool_ref_model — differential, gauntlet, fuzzer)
        run: cargo test --manifest-path crates/pool_ref_model/Cargo.toml --release
      - name: test (protocol_types)
        run: cargo test --manifest-path crates/protocol_types/Cargo.toml

      # ---- Build the on-chain template to WASM (release) ----
      - name: build fungible_pool WASM
        run: cargo build --manifest-path templates/fungible_pool/Cargo.toml --release --target wasm32-unknown-unknown

      - name: build nft_marketplace WASM
        run: cargo build --manifest-path templates/nft_marketplace/Cargo.toml --release --target wasm32-unknown-unknown

      - name: build nft_item_offer WASM
        run: cargo build --manifest-path templates/nft_item_offer/Cargo.toml --release --target wasm32-unknown-unknown

      - name: build nft_collection_bid WASM
        run: cargo build --manifest-path templates/nft_collection_bid/Cargo.toml --release --target wasm32-unknown-unknown

      # Reproducible-build gate: path-remapped, --locked, pinned toolchain, in a clean target
      # dir. Fails if any template's sha256 differs from templates/WASM_SHA256SUMS, so the hash
      # an operator records before publishing is the hash anyone can rebuild from this commit.
      - name: Reproducible template WASM (byte-exact against templates/WASM_SHA256SUMS)
        env:
          RUSTFLAGS: ""
        run: bash tools/build-templates.sh --check

      # ---- REAL Ootle engine tests (never skipped; failure fails the job) ----
      # tari_template_test_tooling compiles the real templates (fungible_pool, faucet, hostile)
      # to WASM and runs them in the engine. This step is the authoritative runtime evidence.
      - name: Engine tests (audit_engine_tests)
        run: cargo test --manifest-path audit_engine_tests/Cargo.toml -- --nocapture
