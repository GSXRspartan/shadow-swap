[workspace]

[package]
name = "audit_engine_tests"
version = "0.0.0"
edition = "2021"
publish = false

# Host-side engine test harness for the SECURITY_AUDIT_OPUS run.
# Points tari_template_test_tooling at the REAL pool template
# (../templates/fungible_pool) so authorization and accounting
# properties are proven by real engine execution, not by inspection.

