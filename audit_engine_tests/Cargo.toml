[workspace]

[package]
name = "audit_engine_tests"
version = "0.0.0"
edition = "2021"
publish = false

# Host-side engine test harness for the SECURITY_AUDIT_OPUS run.
# Points tari_template_test_tooling at the REAL pool template
# (../templates/fungible_pool) so authorization and accounting
# properties are proven by real engine execution, not by inspection.

[dependencies]

[dev-dependencies]
# One cohort, one revision: the v0.45.0 release commit (9c62606). The engine and test tooling that
# execute the templates in tests must be the same build the Protocol-V1 Esmeralda validators run,
# or a test pass proves nothing about the network.
tari_template_test_tooling = { git = "https://github.com/tari-project/tari-ootle.git", rev = "9c626062673760530ffb075b6b006a67becebe5a" }
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "9c626062673760530ffb075b6b006a67becebe5a" }
tari_template_abi = { git = "https://github.com/tari-project/tari-ootle.git", rev = "9c626062673760530ffb075b6b006a67becebe5a" }
tari_ootle_transaction = { git = "https://github.com/tari-project/tari-ootle.git", rev = "9c626062673760530ffb075b6b006a67becebe5a" }
tari_ootle_common_types = { git = "https://github.com/tari-project/tari-ootle.git", rev = "9c626062673760530ffb075b6b006a67becebe5a" }
tari_engine_types = { git = "https://github.com/tari-project/tari-ootle.git", rev = "9c626062673760530ffb075b6b006a67becebe5a" }
# NOT a floating "0.24": the v0.45.0 workspace pins tari_crypto 0.24.0 (it was bumped from 0.23.x in
# this release). tari_engine_types 0.45.0 requires tari_crypto ^0.24, so this must match or the
# cohort is unresolvable.
tari_crypto = "0.24.0"
