[workspace]

[package]
name = "audit_engine_tests"
version = "0.0.0"
edition = "2021"
publish = false

# Host-side engine test harness for the SECURITY_AUDIT_OPUS run.
# Points tari_template_test_tooling at the REAL pool template
# (../templates/fungible_pool) so authorization and accounting
# properties are proven by real engine execution, not by inspection.

[dependencies]

[dev-dependencies]
# One cohort, one revision: the v0.48.0 release commit (6a25dbc, 2026-10-29). The engine and test
# tooling that execute the templates in tests must be the same build the Esmeralda validators run,
# or a test pass proves nothing about the network. v0.48.0 is the testnet-reset release (single V0
# genesis, sr25519 transaction signatures, CBOR-encoded indexer values); the suite compiled and
# passed against it with no source changes (47/47 locally, 2026-10-31).
#
# History: v0.46.0 retired `FinalizeResult.execution_results` (#2859); `TemplateTest::return_values()`
# replaces the old `res.finalize.execution_results[0].get_value(...)` reads.
tari_template_test_tooling = { git = "https://github.com/tari-project/tari-ootle.git", rev = "6a25dbc524581bfaa0a3c6ef120f8d59cc827572" }
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "6a25dbc524581bfaa0a3c6ef120f8d59cc827572" }
tari_template_abi = { git = "https://github.com/tari-project/tari-ootle.git", rev = "6a25dbc524581bfaa0a3c6ef120f8d59cc827572" }
tari_ootle_transaction = { git = "https://github.com/tari-project/tari-ootle.git", rev = "6a25dbc524581bfaa0a3c6ef120f8d59cc827572" }
tari_ootle_common_types = { git = "https://github.com/tari-project/tari-ootle.git", rev = "6a25dbc524581bfaa0a3c6ef120f8d59cc827572" }
tari_engine_types = { git = "https://github.com/tari-project/tari-ootle.git", rev = "6a25dbc524581bfaa0a3c6ef120f8d59cc827572" }
# NOT a floating "0.24": the v0.48.0 workspace pins tari_crypto 0.24.1. tari_engine_types 0.48.0
# requires tari_crypto ^0.24, so this must match the workspace or the cohort is unresolvable.
tari_crypto = "0.24.1"
# Used only by tests/wire_fixtures_v048.rs to render `Encoded<T>` exactly as the indexer's JSON does
# (base64). Already in the lockfile through the engine; declared here so the test can name it.
serde_json = "1"
# Test-only: derive RistrettoPublicKeyBytes for a second signer (p2p_offer designated taker).
ootle_byte_type = { git = "https://github.com/tari-project/tari-ootle.git", rev = "6a25dbc524581bfaa0a3c6ef120f8d59cc827572" }
# Test-only: compute the SHA-256 hash lock for tests/p2p_offer_routes.rs (already in the lockfile).
sha2 = "0.10"
