[workspace]

[package]
name = "audit_engine_tests"
version = "0.0.0"
edition = "2021"
publish = false

# Host-side engine test harness for the SECURITY_AUDIT_OPUS run.
# Points tari_template_test_tooling at the REAL pool template
# (../templates/fungible_pool) so authorization and accounting
# properties are proven by real engine execution, not by inspection.

[dependencies]

[dev-dependencies]
# One cohort, one revision: the signed v0.50.1 release commit (0b3f364). The engine and test
# tooling that execute the templates in tests must be the same build the target validators run.
# v0.50 requires V2 template definitions and tightens method resolution, vault ownership,
# fee processing, and access-rule validation, so a v0.49 engine test is not compatibility
# evidence.
#
# History: v0.46.0 retired `FinalizeResult.execution_results` (#2859); `TemplateTest::return_values()`
# replaces the old `res.finalize.execution_results[0].get_value(...)` reads.
# v0.50.1 continues to pin tari_crypto 0.24.1. tari_engine_types 0.50.1
# requires tari_crypto ^0.24, so this must match the workspace or the cohort is unresolvable.
tari_crypto = "0.24.1"
# Test-only: tests/claim_burn_authorization.rs needs the `ClaimProofVerifier` trait the engine
# delegates L1 burn-proof authenticity to. The engine does NOT verify a burn proof itself — a
# validator node supplies the verifier that scans the base layer — so a host test can only
# prove the AUTHORIZATION model, with the verifier's verdict injected. That distinction is the
# point of the test, so the trait has to be nameable.
tari_template_test_tooling = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
tari_template_abi = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
tari_ootle_transaction = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
tari_ootle_common_types = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
tari_engine_types = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
tari_engine = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
# Enable Tari's official build.rs generation path before the engine tests run. This creates
# account.wasm and the other built-in artifacts from the same pinned revision; no placeholder
# or copied v0.48 artifact can satisfy the dependency.
tari_template_builtin = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7", features = ["templates"] }
# Test-only: a second random keypair for "sealed by the wrong key" (claim_burn_authorization).
# Must be the rand whose `rand_core` tari_crypto 0.24.1 implements its `Rng`/`CryptoRng` bounds
# against, or `random_keypair` does not accept the thread rng.
rand = "0.10"
# Test-only: `BurnOutput`'s script/covenant/metadata_signature/encrypted_data are
# `bounded_vec::BoundedVec`, so building one by hand needs the crate by name. Same version the
# cohort's engine_types uses.
bounded-vec = "0.9"
# Used only by tests/wire_fixtures_v048.rs to render `Encoded<T>` exactly as the indexer's JSON does
# (base64). Already in the lockfile through the engine; declared here so the test can name it.
serde_json = "1"
# Test-only: derive RistrettoPublicKeyBytes for a second signer (p2p_offer designated taker).
ootle_byte_type = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
# Test-only: compute the SHA-256 hash lock for tests/p2p_offer_routes.rs (already in the lockfile).
sha2 = "0.10"
