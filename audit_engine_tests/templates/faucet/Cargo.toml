[workspace]

[package]
name = "faucet"
version = "0.1.0"
edition = "2021"

[dependencies]
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "aa7b0c81719e5c3cfaf9bf3b5fb87bd83180cb90" }

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
strip = "debuginfo"

[lib]
crate-type = ["cdylib"]
