[workspace]

[package]
name = "stealth_probe"
version = "0.1.0"
edition = "2021"

# TEST-ONLY template for tests/stealth_route_probe.rs (Phase 6 research). It is never
# published and is not part of any Shadow Swap deployment.

[dependencies]
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "6a25dbc524581bfaa0a3c6ef120f8d59cc827572" }

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
strip = "debuginfo"

[lib]
crate-type = ["cdylib"]
