<!--
  Social preview card (og:image / twitter:image).

  1200x630 is the smallest size that renders un-cropped across the card, timeline,
  and Slack-style unfurl layouts. SVG so it stays crisp, stays a few hundred bytes,
  and stays reviewable as text — there is no binary asset here that nobody can diff.

  The card deliberately leads with the name and the one-line promise rather than a
  chart. A price chart in a preview would be either fabricated or stale within a
  day, and both would be worse than saying nothing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Shadow Swap — trade Tari assets, provide liquidity, explore NFT markets">
  <title>Shadow Swap — Tari liquidity &amp; NFT markets</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- The mark, enlarged. Same geometry as icon.svg, drawn once here rather than
       referenced so the card renders identically without a second request. -->
  <g transform="translate(96 96) scale(3.4)">
    <rect width="24" height="24" rx="6" fill="#0d1017"/>
    <rect x="1.25" y="1.25" width="21.5" height="21.5" rx="6" stroke="#3a4356" stroke-width="1.5"/>
    <path d="M6 15.5c2.2 0 2.2-7 4.4-7s2.2 7 4.4 7 2.2-4 3.2-4" stroke="#f0b429" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="6" cy="15.5" r="1.6" fill="#f0b429"/>
    <circle cx="18" cy="11.5" r="1.6" fill="#8b96a8"/>
  </g>

  <text x="96" y="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="96" font-weight="700" letter-spacing="-2" fill="#f5f7fa">Shadow Swap</text>
  <text x="96" y="392" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" fill="#9aa5b8">Trade Tari assets. Provide liquidity. Explore NFT markets.</text>

  <rect x="96" y="440" width="6" height="40" rx="3" fill="#f0b429"/>
  <text x="122" y="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" fill="#6b7689">Non-custodial · testnet · not audited for mainnet</text>
</svg>