<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06080c" />
    <title>Shadow Swap — Tari liquidity &amp; NFT markets (testnet)</title>
    <meta
      name="description"
      content="Shadow Swap is a non-custodial liquidity and NFT trading protocol for Tari's Ootle network. Trade Tari assets, provide liquidity, and explore NFT markets. Experimental software on a test network. Not audited for mainnet."
    />
    <meta name="application-name" content="Shadow Swap" />
    <meta name="apple-mobile-web-app-title" content="Shadow Swap" />

    <!--
      Social preview.

      These are what a link to this app renders as in a chat or on a card. Without
      them the product has no identity outside its own page: the tab title is not
      shown, and the link text is whatever the poster typed.

      Deliberately absolute URLs, because relative ones do not resolve in a preview.
      They are canonical GitHub raw URLs for the committed brand asset, so they
      cannot drift from a deployed host and go stale the way a hardcoded domain
      would. The repository name is part of that path and is stable after the
      rename, which is why this is safe to write now.

      THE IMAGE IS A PNG, NOT AN SVG, AND THAT IS NOT A PREFERENCE.
      Twitter/X, Facebook, LinkedIn, Slack and Discord all REFUSE SVG for
      `og:image` / `twitter:image`: the card renders with no picture at all. The
      committed `og-card.svg` was therefore a social preview that silently did not
      appear anywhere. `og-card.png` is 1200x630, which is the size both platforms
      ask for, and `og:image:width` / `:height` are declared so a scraper does not
      have to guess an aspect ratio. The SVG is retained for favicons and PWA use,
      where SVG *is* supported.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shadow Swap" />
    <meta property="og:title" content="Shadow Swap — Tari liquidity &amp; NFT markets" />
    <meta
      property="og:description"
      content="Non-custodial liquidity and NFT trading on Tari's Ootle network. Trade Tari assets, provide liquidity, explore NFT markets."
    />
    <meta property="og:image" content="https://raw.githubusercontent.com/GSXRspartan/shadow-swap/main/apps/web/public/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Abstract green and teal liquidity curves converging on a single priced node over market-depth bars, on near-black. Shadow Swap — trade Tari assets, provide liquidity, explore NFT markets."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shadow Swap — Tari liquidity &amp; NFT markets" />
    <meta
      name="twitter:description"
      content="Non-custodial liquidity and NFT trading on Tari's Ootle network. Trade Tari assets, provide liquidity, explore NFT markets."
    />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/GSXRspartan/shadow-swap/main/apps/web/public/og-card.png" />
    <meta name="twitter:image:alt" content="Shadow Swap — Tari liquidity and NFT markets on a test network." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      Content Security Policy.

      A wallet dApp reaches `window.tari` through the official integration model:
      the dApp includes the wallet's connector script unconditionally, and the
      connector supplies the provider when the dApp runs inside a Tari Universe
      iframe and stands aside when a Sapient extension already owns `window.tari`
      in an ordinary tab. So this app must work in BOTH placements.

        default-src 'self'   nothing loads unless explicitly allowed
        script-src  'self' https://universe.tari.mw
                            the ONE non-'self' script source is the wallet
                            connector origin. It is exact, never a wildcard. The
                            connector is a cross-origin script loaded into THIS
                            document, so `'self'` alone would block it and leave
                            the embedded placement unable to connect at all. No
                            'unsafe-inline' and no 'unsafe-eval' is accepted in
                            exchange: Vite emits a module script and nothing else.
        connect-src 'self' + the two allow-listed Esmeralda indexer
                            origins, plus the public content gateways NFT
                            metadata is fetched from. Metadata is read with
                            fetch(), which connect-src governs - NOT img-src - so
                            omitting them blocked every off-indexer collection
                            and left every card showing a blank placeholder. See
                            NFT_METADATA_GATEWAY_URLS in lib/networks.ts for the
                            tradeoff.
                            A configured custom indexer is added at build time
                            only if it is not a private-network address; the
                            build fails rather than shipping a localhost
                            dependency.
        img-src     'self' data: https:   NFT media is attacker-controlled, so
                            https is allowed and validated per-URL by
                            safeImageUrl (scheme, credentials, length).
        frame-src   'none'   this app never embeds a frame. Being framed BY the
                            wallet is expressed by the deployment response
                            header (see docs/FRONTEND_SECURITY_MODEL.md), not
                            here.
        frame-ancestors        NOT SET HERE. A meta CSP silently ignores
                            frame-ancestors, so declaring it would be false
                            assurance. The deployment MUST send
                            `Content-Security-Policy: frame-ancestors 'self'
                            https://universe.tari.mw` as a real header, or the
                            wallet cannot embed this app.
        object-src 'none'    no plugins
        base-uri    'self'    no <base> hijacking
        form-action 'none'   no form exfiltration
        upgrade-insecure-requests

      `style-src` needs 'unsafe-inline' because React sets a handful of layout
      styles as style attributes; there is no CSS injection vector because no
      untrusted value ever reaches a style property (asserted in
      test/security.test.cjs).

      A BROWSER ENFORCES BOTH this meta policy and the response-header policy, and
      the effective result is their INTERSECTION. The `script-src` and
      `connect-src` lists below were therefore independent hand-maintained copies
      of the ones in apps/web/src/lib/deploymentHeaders.ts, and they had drifted:
      the response header carried the wallet origin for `script-src` while this
      meta tag did not, so the effective policy blocked the connector even though
      the header was correct — and the embedded placement could never have
      connected.

      `test/deployment.test.cjs` now asserts the `script-src` and `connect-src`
      lists are identical in BOTH places, so neither copy can drift again without
      failing the build.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://universe.tari.mw; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://ootle-indexer-a.tari.com https://ootle-indexer-b.tari.com https://ipfs.io https://dweb.link https://cloudflare-ipfs.com https://gateway.pinata.cloud https://arweave.net; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests;"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This application requires JavaScript.</noscript>
    <!--
      The Tari wallet connector, included UNCONDITIONALLY, as the official
      integration model requires ("Include it always.").

      It is what makes the wallet reachable when this dApp is embedded in a Tari
      Universe iframe, and it stands aside when a browser-extension provider
      already owns `window.tari` in an ordinary tab. Including it conditionally —
      after trying to detect which wallet is present — is exactly the
      wallet-detection the documentation forbids, and it would also race the
      provider's own initialisation.

      Loading it here, in the document, before the app's module script, is
      deliberate: the provider is published on script load, so the app observes a
      provider that already exists. The app still tolerates a provider that
      appears later, via the documented `tari#initialized` event, because the
      extension injects at `document_start` and either order is possible.

      It is `async`/`defer`-free on purpose: a deferred connector would race the
      first render, and a synchronous cross-origin script at the end of <head>
      cannot observe or alter the app's DOM. The exact origin is allowed by the
      `script-src` above; nothing wider is permitted.
    -->
    <script src="https://universe.tari.mw/tari-connector.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
