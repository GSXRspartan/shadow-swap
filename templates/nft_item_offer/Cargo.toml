[package]
name = "nft_item_offer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the signed v0.50.1 release commit (0b3f364), the same cohort as every other template and the
# engine suite. Templates must be published only after an operator records the fresh deployment.
tari_template_abi = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
