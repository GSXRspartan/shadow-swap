[package]
name = "cross_layer_htlc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# EXPERIMENTAL, UNPUBLISHED. A noncustodial peer-to-peer escrow offer for assets that do not
# belong in the public AMM (created-Stealth revealed balances, NFT barter, agreed-price trades).
# Same signed v0.50.1 cohort as every other template. Not part of the versioned checksum manifest until an
# operator decides to publish it.
[dependencies]
tari_template_abi = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
