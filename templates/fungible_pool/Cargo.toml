[package]
name = "fungible_pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the v0.48.0 release commit (6a25dbc, 2026-10-29) — the latest official Ootle release,
# and a TESTNET RESET: Esmeralda restarts from a fresh V0 genesis and every template must be
# rebuilt and republished (CHANGELOG 0.48.0, "Template authors"). Every Tari/Ootle crate below
# comes from that one workspace (tari_template_lib 0.36.0, tari_template_abi 0.22.0) so the
# template ABI and the engine that executes it are never a mixed cohort.
#
# The PRE-RESET Pool v2 artifact (template f47a330e…, built at a43773e / v0.42.0) remains the
# historical on-chain identity of that generation only; it does not exist on the reset network
# and was NOT republished. Publishing the v0.48 build is an operator action outside this branch.
tari_template_abi = { git = "https://github.com/tari-project/tari-ootle.git", rev = "6a25dbc524581bfaa0a3c6ef120f8d59cc827572" }
# `precision` (192-bit intermediate math) and `extra-arith` (checked_sqrt) are required by the
# overflow-safe LP/AMM math in lib.rs; both pass through to tari_template_lib_types and are WASM-safe.
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "6a25dbc524581bfaa0a3c6ef120f8d59cc827572", features = ["precision", "extra-arith"] }

# NOTE: Real engine tests live in the standalone host crate `audit_engine_tests/`, which points
# tari_template_test_tooling at this template directory and compiles it to WASM. They are kept out
# of this cdylib package because a `wasm32` cdylib cannot also build host-side integration tests.

[profile.release]
opt-level = "z"
lto = true
panic = "abort"

[features]
default = []
