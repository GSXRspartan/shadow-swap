[package]
name = "fungible_pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to v0.41.1 (tag ba8e20469aadeee065f05566587eb93d5fe4d282, commit 4732f65) for Esmeralda compatibility.
tari_template_abi = { git = "https://github.com/tari-project/tari-ootle.git", rev = "4732f65ec17a96547050989d78fd70a4e3d94113" }
# `precision` (192-bit intermediate math) and `extra-arith` (checked_sqrt) are required by the
# overflow-safe LP/AMM math in lib.rs; both pass through to tari_template_lib_types and are WASM-safe.
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "4732f65ec17a96547050989d78fd70a4e3d94113", features = ["precision", "extra-arith"] }

# NOTE: Real engine tests live in the standalone host crate `audit_engine_tests/`, which points
# tari_template_test_tooling at this template directory and compiles it to WASM. They are kept out
# of this cdylib package because a `wasm32` cdylib cannot also build host-side integration tests.

[profile.release]
opt-level = "z"
lto = true
panic = "abort"

[features]
default = []
