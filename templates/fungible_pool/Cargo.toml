[package]
name = "fungible_pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the signed v0.50.1 release commit (0b3f364, 2026-11-07). Every Tari/Ootle crate
# below comes from that one workspace (tari_template_lib 0.38.0) so the template ABI and the
# engine that executes it are never a mixed cohort. v0.50 requires the V2 template-definition
# layout; templates built against an earlier template library do not load on Esmeralda.
#
# The PRE-RESET Pool v2 artifact (template f47a330e…, built at a43773e / v0.42.0) remains the
# historical on-chain identity of that generation only; it does not exist on the reset network
# and was NOT republished. Publishing the v0.48 build is an operator action outside this branch.
tari_template_abi = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
# `precision` (192-bit intermediate math) and `extra-arith` (checked_sqrt) are required by the
# overflow-safe LP/AMM math in lib.rs; both pass through to tari_template_lib_types and are WASM-safe.
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7", features = ["precision", "extra-arith"] }

# NOTE: Real engine tests live in the standalone host crate `audit_engine_tests/`, which points
# tari_template_test_tooling at this template directory and compiles it to WASM. They are kept out
# of this cdylib package because a `wasm32` cdylib cannot also build host-side integration tests.

[profile.release]
opt-level = "z"
lto = true
panic = "abort"

[features]
default = []
