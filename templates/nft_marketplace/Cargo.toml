[package]
name = "nft_marketplace"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the same signed v0.50.1 release commit (0b3f364) as the fungible pool. Templates
# must be rebuilt and republished with their V2 template definitions.
tari_template_abi = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "0b3f364dd0eaff9997b08d722948619981b62ce7" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
