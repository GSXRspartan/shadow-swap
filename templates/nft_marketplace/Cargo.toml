[package]
name = "nft_marketplace"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the same v0.49.2 release commit (aa7b0c8) as the fungible pool. v0.49 is a testnet
# reset: templates must be republished on the reset network.
tari_template_abi = { git = "https://github.com/tari-project/tari-ootle.git", rev = "aa7b0c81719e5c3cfaf9bf3b5fb87bd83180cb90" }
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "aa7b0c81719e5c3cfaf9bf3b5fb87bd83180cb90" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
